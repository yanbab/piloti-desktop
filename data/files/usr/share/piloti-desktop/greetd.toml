# Example /etc/greetd/config.toml to use Piloti Display Manager as a GDM/SDDM replacement.
# Copy to /etc/greetd/config.toml, then enable greetd:
#   sudo systemctl disable --now gdm3 sddm lightdm 2>/dev/null || true
#   sudo systemctl enable --now greetd

[terminal]
vt = 1

[default_session]
command = "/usr/bin/piloti-greeter"
user = "_greetd"
