# Piloti keys linked to GNOME keys (Linux). While "sync-gnome-settings" is on,
# a linked key reads GNOME's value once set there, and writes go to both.
#
# [<piloti schema>]
# <key>=<gnome schema> <gnome key> <type: s b i d> [write-only]
#
# [values:<piloti schema>/<key>], when the two spell values differently:
# <gnome value>=<piloti value>[;<piloti value>…]   others are not synced

[org.piloti.desktop.interface]
color-scheme=org.gnome.desktop.interface color-scheme s
accent-color=org.gnome.desktop.interface accent-color s
icon-theme=org.gnome.desktop.interface icon-theme s write-only

[values:org.piloti.desktop.interface/color-scheme]
default=light;system
prefer-light=light
prefer-dark=dark

[values:org.piloti.desktop.interface/accent-color]
blue=blue
teal=teal
green=green
yellow=yellow
orange=orange
red=red
pink=pink
purple=purple
slate=graphite

[org.piloti.desktop.topbar]
clock-24-hour=org.gnome.desktop.interface clock-format s
clock-show-seconds=org.gnome.desktop.interface clock-show-seconds b

[values:org.piloti.desktop.topbar/clock-24-hour]
24h=true
12h=false

[org.piloti.desktop.fonts]
gtk-font-name=org.gnome.desktop.interface font-name s
gtk-document-font-name=org.gnome.desktop.interface document-font-name s
gtk-monospace-font-name=org.gnome.desktop.interface monospace-font-name s
gtk-text-scaling-factor=org.gnome.desktop.interface text-scaling-factor d
gtk-font-antialiasing=org.gnome.desktop.interface font-antialiasing s
gtk-font-hinting=org.gnome.desktop.interface font-hinting s
gtk-font-rgba-order=org.gnome.desktop.interface font-rgba-order s

[org.piloti.desktop.background]
picture-uri=org.gnome.desktop.background picture-uri s
picture-uri-dark=org.gnome.desktop.background picture-uri-dark s
picture-options=org.gnome.desktop.background picture-options s
color-shading-type=org.gnome.desktop.background color-shading-type s
primary-color=org.gnome.desktop.background primary-color s
secondary-color=org.gnome.desktop.background secondary-color s
picture-opacity=org.gnome.desktop.background picture-opacity i

[org.piloti.desktop.wm]
button-layout=org.gnome.desktop.wm.preferences button-layout s

[org.piloti.desktop.notifications]
do-not-disturb=org.gnome.desktop.notifications show-banners b
show-in-lock-screen=org.gnome.desktop.notifications show-in-lock-screen b

[values:org.piloti.desktop.notifications/do-not-disturb]
false=true
true=false
